[project]
name = "ai-course-workspace"
version = "0.1.0"
description = "Phase 0 / Lesson 06 练习 3：同时需要 PyTorch 和 Anthropic SDK 的项目配置"
requires-python = ">=3.11"

# 基础依赖：每个 phase 都要用的，装了就跑
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "matplotlib>=3.8,<4",
    "scikit-learn>=1.4,<2",
    "jupyterlab>=4.0,<5",
]

# 可选依赖组：按需安装，避免一次性拖 3GB
[project.optional-dependencies]

# uv pip install -e ".[torch]"
torch = [
    "torch>=2.6,<3",
    "torchvision>=0.21,<1",
    "torchaudio>=2.6,<3",
]

# uv pip install -e ".[llm]"
llm = [
    "anthropic>=0.40",
    "python-dotenv>=1.0",   # 06 课发现的：.env 不会自己加载，需要它
]

# uv pip install -e ".[dev]"
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "nbstripout>=0.7",      # 05 课发现的：提交前清掉 notebook 输出
]

# uv pip install -e ".[all]"
all = [
    "ai-course-workspace[torch]",
    "ai-course-workspace[llm]",
    "ai-course-workspace[dev]",
]

# ---------------------------------------------------------------
# CUDA 版本的 torch 不在 PyPI 默认源上，需要额外指定索引。
# 这是 uv 的项目级配置（pip 不认这一段，pip 用命令行 --index-url）。
# 你的驱动 566.24 支持 CUDA 12.7，torch cu124 满足 12.4 <= 12.7。
# ---------------------------------------------------------------
[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true            # 只有上面点名的包才从这个源找，其余走 PyPI

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_course_workspace"]
